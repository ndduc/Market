# Daily live-data refresh for all Market sibling reports.
# Secrets (repo Settings → Secrets and variables → Actions):
#   CENSUS_API_KEY, FRED_API_KEY, BLS_API_KEY, BEA_API_KEY
#
# Schedule: every day 14:00 UTC. Also runnable via "Run workflow".
# Does NOT commit or open PRs — uploads run artifacts only.

name: Daily data refresh

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Live fetch + rebuild all reports
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for k in CENSUS_API_KEY FRED_API_KEY BLS_API_KEY BEA_API_KEY; do
            if [ -z "${!k}" ]; then
              echo "::error::Missing Actions secret: $k - add it under Settings -> Secrets -> Actions"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          python -m pipeline.refresh_all --strict --archive

      - name: Upload refresh artifacts
        uses: actions/upload-artifact@v4
        with:
          name: market-refresh-${{ github.run_id }}
          path: |
            data/
            archives/
            rental_market_report.md
            apartment_market_report.md
            sfh_appreciation_report.md
          if-no-files-found: error
          retention-days: 30
