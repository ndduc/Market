<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffcf7" />
  <meta name="color-scheme" content="light" />
  <title>Report · Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/report.css?v=20260726-ext-tab" />
</head>
<body>
  <header class="topbar">
    <a href="index.html">← All reports</a>
    <span id="doc-title" class="title">Loading…</span>
    <span class="spacer"></span>
    <a id="raw-link" class="raw-link" href="#">Raw .md</a>
  </header>
  <main class="wrap">
    <article id="content"></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script>
    (function () {
      var src = new URLSearchParams(location.search).get("src");
      var raw = document.getElementById("raw-link");
      if (src && /^[a-z0-9_\-]+\.md$/i.test(src)) {
        raw.href = src;
        raw.textContent = "Raw .md";
      } else {
        raw.remove();
      }
    })();
  </script>
  <script src="assets/js/report-viewer.js?v=20260726-ext-tab"></script>
</body>
</html>
